<div class="kart">
    <h2>Robux Fiyatları</h2>

    <p id="fiyat80"></p>
    <p id="fiyat100"></p>
    <p id="fiyat400"></p>
    <p id="fiyat1000"></p>
    <p id="fiyat2000"></p>
    <p id="fiyat5000"></p>
    <p id="fiyat10000"></p>

</div>


<script>

const robuxTL = 1.50;
const dolarKuru = 40;


function hesapla(robux) {

    let tl = robux * robuxTL;
    let dolar = tl / dolarKuru;

    return `
    <strong>${robux} Robux</strong><br>
    ${tl.toFixed(2)} TL<br>
    ${dolar.toFixed(2)} Dolar
    <hr>
    `;

}


document.getElementById("fiyat80").innerHTML = hesapla(80);
document.getElementById("fiyat100").innerHTML = hesapla(100);
document.getElementById("fiyat400").innerHTML = hesapla(400);
document.getElementById("fiyat1000").innerHTML = hesapla(1000);
document.getElementById("fiyat2000").innerHTML = hesapla(2000);
document.getElementById("fiyat5000").innerHTML = hesapla(5000);
document.getElementById("fiyat10000").innerHTML = hesapla(10000);

</script>
